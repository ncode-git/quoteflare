# Generic config for local development and the Deploy to Cloudflare button.
# For your own deployment, copy it to wrangler.production.toml (gitignored) and
# add remote = true to its D1 binding.
name = "quoteflare"
main = "src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
keep_vars = true

# Add your domain, e.g. routes = [{ pattern = "invoices.example.com", custom_domain = true }].
workers_dev = false
preview_urls = false
routes = []

[triggers]
crons = ["30 3 * * *"]

# /i/<token> is a bearer credential, so keep it out of the logs.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true

[observability.traces]
enabled = false

[observability.issues]
enabled = true

# Do not uncomment these for a real deployment: a var listed here overwrites the
# dashboard value on every deploy, even with keep_vars. Set them in the
# dashboard, or in wrangler.production.toml. Example values for local development:
[vars]
ACCESS_TEAM_DOMAIN = "ncode.cloudflareaccess.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAFqo9l0fxvJ_hwbY"
EMAIL_FROM = "Invoices <invoices@notify.ncode.global>"
APP_ORIGIN = "https://invoices.ncode.global"
ALLOWED_ORIGINS = "https://invoices.ncode.global"

# When you create the D1 database yourself, add database_id.
[[d1_databases]]
binding = "DB"
database_name = "quoteflare"
migrations_dir = "drizzle"

# Optional. R2 stores the invoice logo, and Cloudflare asks for a payment method
# before you can use it. Leave this block commented out to deploy without one.
# The logo upload then disappears from /admin/settings. To turn it on, create the
# bucket with `bunx wrangler r2 bucket create quoteflare` and uncomment these lines.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "quoteflare"

# Per-IP limits on the public endpoints.
[[ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "INVOICE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
